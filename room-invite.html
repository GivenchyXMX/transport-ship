<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>运输船 · 房间邀请</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101013;color:#eee;font:15px system-ui,"PingFang SC",sans-serif}
    main{width:min(420px,calc(100vw - 48px));padding:28px;border:1px solid #514027;border-radius:14px;background:#1b1917;text-align:center}
    h1{font-size:20px;color:#f5bd4d}p{line-height:1.7;color:#c8c6c2}a{color:#f5bd4d}
  </style>
</head>
<body>
  <main><h1>运输船房间邀请</h1><p id="message">正在查看房间…</p><a href="/transport-ship-mp.html">进入联机大厅</a></main>
  <script>
    (async () => {
      const message = document.getElementById('message');
      const token = new URLSearchParams(location.hash.slice(1)).get('token');
      history.replaceState(null, '', '/room-invite.html');
      if (!token) { message.textContent = '邀请链接缺少令牌'; return; }
      try {
        const response = await fetch('/api/room-link/preview', { method: 'POST', cache: 'no-store',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
        const info = await response.json();
        if (!response.ok) throw new Error(info.error || '邀请链接无效');
        if (info.vacancies <= 0) throw new Error('房间已满，无法加入');
        sessionStorage.setItem('ship_invite_intent', JSON.stringify({ roomId: info.roomId,
          instanceId: info.instanceId, linkToken: token, linkInfo: info }));
        location.replace('/transport-ship-mp.html');
      } catch (error) { message.textContent = error.message || '邀请链接无法使用'; }
    })();
  </script>
</body>
</html>
